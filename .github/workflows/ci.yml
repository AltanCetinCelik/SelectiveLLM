name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy selectivellm
      - run: pytest --cov=selectivellm --cov-report=term --cov-fail-under=75
      - run: python -m build
      - run: selectivellm inspect --device cpu
      - run: selectivellm benchmark --router semantic --report --output /tmp/selectivellm-results
