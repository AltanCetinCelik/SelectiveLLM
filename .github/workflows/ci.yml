name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Upgrade pip
        run: python -m pip install --upgrade pip

      - name: Install development dependencies
        run: pip install -e ".[dev]"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check selectivellm tests experiments examples

      - name: Type check
        run: mypy selectivellm

      - name: Tests
        run: |
          pytest \
            --cov=selectivellm \
            --cov-report=term \
            --cov-fail-under=70

      - name: Build package
        run: python -m build

      - name: CLI smoke test
        run: selectivellm inspect --device cpu

      - name: Deterministic benchmark smoke test
        run: |
          selectivellm benchmark \
            --router semantic \
            --report \
            --output /tmp/selectivellm-results
