name: Bug report
description: Report reproducible incorrect behavior.
title: "[Bug]: "
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Include commands, minimal configuration, and relevant output.
    validations:
      required: true
  - type: input
    id: fingerprint
    attributes:
      label: Benchmark fingerprint
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Paste `selectivellm inspect` output and backend/model identity.
