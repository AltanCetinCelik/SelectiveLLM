schema_version: "1.0.0"
seed: 42
mode: semantic_routing
registry_path: ./registry.real.example.yaml
benchmark_path: ../selectivellm/resources/hero_v1.yaml
analyzer:
  type: deterministic_embedding
  dimension: 256
router:
  version: "1.0.0"
  type: hybrid
  top_k: 3
  threshold: 0.18
  keyword_weight: 0.35
  embedding_weight: 0.65
runtime:
  memory_budget_mb: 8192
  cache_policy: lru
  cache_enabled: true
backend:
  type: transformers_peft
  model_path: /absolute/path/to/base-model
  tokenizer_path: null
  trust_remote_code: false
  max_new_tokens: 128
  device: auto
  device_map: auto
  max_memory: null
