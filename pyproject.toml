[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "selectivellm"
version = "0.1.0"
description = "Semantic model paging and dynamic expert routing for memory-constrained LLM inference"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [{name = "SelectiveLLM contributors"}]
keywords = ["llm", "routing", "peft", "lora", "inference", "memory"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  "matplotlib>=3.8",
  "numpy>=1.26,<2.3",
  "psutil>=5.9",
  "pydantic>=2.7",
  "PyYAML>=6.0",
  "rich>=13.7",
  "typer>=0.12",
]

[project.optional-dependencies]
hf = [
  "accelerate>=0.33",
  "peft>=0.12",
  "torch>=2.2",
  "transformers>=4.44",
]
dev = [
  "build>=1.2",
  "mypy>=1.11",
  "pre-commit>=3.7",
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "types-PyYAML>=6.0",
  "types-psutil>=5.9",
]

[project.scripts]
selectivellm = "selectivellm.cli:app"

[project.urls]
Homepage = "https://github.com/selectivellm/selectivellm"
Documentation = "https://github.com/selectivellm/selectivellm/tree/main/docs"
Issues = "https://github.com/selectivellm/selectivellm/issues"

[tool.hatch.build.targets.wheel]
packages = ["selectivellm"]

[tool.hatch.build]
include = ["selectivellm/**/*.py", "selectivellm/resources/*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["torch", "torch.*", "transformers", "transformers.*", "peft", "peft.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-ra --strict-markers"
testpaths = ["tests"]
markers = ["hf: optional tests requiring user-supplied Hugging Face assets"]

[tool.coverage.run]
source = ["selectivellm"]
branch = true
